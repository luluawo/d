<!doctype html>
<html lang="en">
  <!-- Local server: $ python3 -m http.server -->
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script src="https://unpkg.com/typescript@5.9.3/lib/typescript.js"></script>
    <script>
      async function load(url) {
        const source = await fetch(url).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        });
        const js = ts.transpile(source, {
          module: ts.ModuleKind.CommonJS,
          target: ts.ScriptTarget.ESNext,
          removeComments: true,
          inlineSourceMap: true,
          inlineSources: true,
        });
        new Function("require", "exports", js)(() => {}, {});
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const scripts = document.querySelectorAll(
          'script[type="text/typescript"][src]',
        );
        for (const el of scripts) {
          await load(el.src);
        }
      });
    </script>
    <script type="text/typescript" src="global.ts"></script>
    <script type="text/typescript" src="main.ts"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap");

      html,
      body {
        margin: 0;
        padding: 0;
        font-size: 16px;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      pre {
        margin: 0;
      }

      .c,
      .r {
        display: flex;
      }

      .c {
        flex-direction: column;
      }

      .r {
        flex-direction: row;
      }

      #panel {
        font-family: "Google Sans Code", monospace;
        position: absolute;
        top: 1rem;
        left: 70%;
        right: 1rem;
        bottom: 1rem;
        background-color: hsla(0, 0%, 100%, 0.5);
        border-radius: 0.5rem;
        backdrop-filter: blur(10px);
        border: 1px solid oklch(0.95 0.0148 264.71);
      }

      #panel > header,
      #panel > header > div {
        gap: 0.62em;
      }

      #panel > header {
        flex-shrink: 0;
        justify-content: space-between;
      }
      #tabs {
        flex-wrap: wrap;
        align-items: center;
      }
      #tabs > .button:hover {
        cursor: pointer;
      }
      #tabs > :not(.active) {
        color: oklch(0.7 0.05 264.71);
      }
      #tabs > .button.active {
        color: deeppink;
        font-weight: bold;
      }

      #close-panel,
      #open-panel {
        cursor: pointer;
        fill: oklch(0.7 0.05 264.71);
      }

      #panel > #editor,
      #panel > header,
      #panel > footer {
        padding: 1.5rem;
      }

      #editor {
        flex: 1;
        outline: none;
        overflow: auto;
        margin: 0;
      }

      #editor,
      footer {
        border-top: 1px solid oklch(0.96 0.0148 264.71);
      }

      #errors {
        position: absolute;
        bottom: 1rem;
        color: deeppink;
        text-align: left;
        padding: 0.5rem 1.5rem;
        z-index: 100;
      }

      ::highlight(parse-error) {
        background: deeppink;
      }

      /*::highlight(comment) {
        color: oklch(0.73 0.0148 264.71);
      }*/

      #open-panel {
        position: absolute;
        top: 2.5rem;
        right: 2.5rem;
      }

      #dropdown {
        font-family: "Google Sans Code", monospace;
        position: absolute;
        background: white;
        border: 1px solid oklch(0.95 0.0148 264.71);
        padding: 0.5rem 0;
        zindex: 9;
        border-radius: 0.5rem;
      }

      .dropdown-option {
        padding: 0.5em 1em;
        cursor: pointer;
      }

      .dropdown-option:hover {
        background-color: oklch(0.95 0.0148 264.71);
      }

      footer {
        gap: 1rem;
        max-height: 30vh;
        overflow: auto;
      }

      footer > .title {
        font-weight: bold;
      }

      .footer-error > .title {
        color: deeppink;
      }

      footer:not(.footer-error) > .title {
        color: dodgerblue;
      }

      footer > .message {
        font-size: 12px;
      }

      .footer-hide {
        display: none !important;
      }

      #tabs,
      footer > .title {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
    <svg style="display: none">
      <defs>
        <symbol id="arrow-top-right" viewBox="0 0 32 32">
          <g
            transform="matrix(0.707107,0.707107,-0.766032,0.766032,23.365696,-2.679404)"
          >
            <path
              d="M10,11.303L10,27.154C10,28.173 9.104,29 8,29C6.896,29 6,28.173 6,27.154L6,11.303L1.636,15.331C0.856,16.052 -0.411,16.052 -1.192,15.331C-1.973,14.611 -1.973,13.441 -1.192,12.72L6.586,5.54C6.967,5.189 7.475,5 8,5C8.525,5 9.033,5.189 9.414,5.54L17.192,12.72C17.973,13.441 17.973,14.611 17.192,15.331C16.411,16.052 15.144,16.052 14.364,15.331L10,11.303Z"
            />
          </g>
        </symbol>
        <symbol id="arrow-bottom-left" viewBox="0 0 32 32">
          <g transform="rotate(180 16 16)">
            <use href="#arrow-top-right"></use>
          </g>
        </symbol>
      </defs>
    </svg>
  </head>
  <body>
    <div id="open-panel">
      <svg width="16" height="16">
        <use href="#arrow-bottom-left"></use>
      </svg>
    </div>
    <canvas></canvas>
    <div id="panel" class="c">
      <header class="r">
        <div id="tabs" class="r"></div>
        <div class="r">
          <div id="close-panel">
            <svg width="16" height="16">
              <use href="#arrow-top-right"></use>
            </svg>
          </div>
        </div>
      </header>
      <pre id="editor" contenteditable="plaintext-only"></pre>
      <footer class="c">
        <div class="title"></div>
        <pre class="message"></pre>
      </footer>
    </div>
  </body>
</html>
